# Haven TV: your personal settings.
# The first build copies this file to haven.properties (git leaves that one out). Change it there, then build again.
# Everything here is optional. Most of it can also be changed on the TV in Home Settings, and the TV's choice wins.

# ── Prayer times ─────────────────────────────────────────────────────────────────────────────────────────────────
# off      no prayer line anywhere (home screen, screensaver, Clock)
# city     calculated for the weather's city, any country (set the method below)
# mosque   your mosque's own adhan and iqama times for the whole year, from themasjidapp.org
prayer=off

# For prayer=mosque: the short name at the end of your mosque's address on themasjidapp.org,
# e.g. themasjidapp.org/cicc → cicc. Until its page is read, the times are calculated for the city.
mosque=

# For prayer=city (and while a mosque's page loads). One of:
#   MWL        Muslim World League (Europe, Far East, much of the world)
#   Makkah     Umm al-Qura (Saudi Arabia)
#   Egypt      Egyptian General Authority of Survey (Africa, Syria, Lebanon)
#   Karachi    University of Islamic Sciences (Pakistan, Bangladesh, India, Afghanistan)
#   ISNA       Islamic Society of North America (USA, Canada)
#   Dubai      UAE
#   Kuwait     Kuwait
#   Qatar      Qatar
#   Turkey     Diyanet (Turkey)
#   Singapore  Singapore, Malaysia, Indonesia
#   Tehran     Institute of Geophysics, University of Tehran (Iran)
#   France     UOIF (France)
prayer_method=MWL

# standard (Shafi'i, Maliki, Hanbali) or hanafi
asr=standard

# ── Football ─────────────────────────────────────────────────────────────────────────────────────────────────────
# Your teams' next matches (every competition), with a countdown, or LIVE with the score.
# Each as ESPN-team-id:Name, comma separated. Leave empty for none. Find a team's id in its ESPN address:
# espn.com/soccer/team/_/id/83/barcelona → 83. Examples: 83 Barcelona, 86 Real Madrid, 359 Arsenal, 360 Man United,
# 364 Liverpool, 382 Man City, 160 PSG, 132 Bayern, 111 Juventus, 997 Trabzonspor, 432 Galatasaray, 436 Fenerbahçe,
# 929 Al Hilal, 817 Al Nassr. Example: teams=83:Barcelona,997:Trabzonspor
teams=
match_lines=true

# ── Markets (the drawer's Markets card) ──────────────────────────────────────────────────────────────────────────
# Coins priced by Binance in US dollars, and stocks by Yahoo Finance (their ticker symbols).
coins=BTC,ETH,XRP
stocks=AAPL

# ── Clock (4K photos with the time) ──────────────────────────────────────────────────────────────────────────────
# Unsplash searches, taken in turn (needs unsplash.local.json; without it, Bing's daily 4K photo only).
photo_themes=landscape,nature,mountains,ocean,forest,lake,aerial landscape,night sky
# Seconds per photo (10 or more).
photo_seconds=30
